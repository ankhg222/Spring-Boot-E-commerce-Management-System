<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout_23110236}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5>Lọc theo danh mục</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            <a th:href="@{/products}" 
                               th:classappend="${currentCategory == null} ? 'active' : ''"
                               class="list-group-item list-group-item-action">
                                Tất cả sản phẩm
                            </a>
                            <a th:each="cat : ${categories}" 
                               th:href="@{/products(category=${cat.categoryName})}"
                               th:classappend="${currentCategory == cat.categoryName} ? 'active' : ''"
                               th:text="${cat.categoryName}"
                               class="list-group-item list-group-item-action">
                                Danh mục
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4>
                            <span th:if="${currentCategory != null}" th:text="'Sản phẩm: ' + ${currentCategory}">Sản phẩm</span>
                            <span th:unless="${currentCategory != null}">Tất cả sản phẩm</span>
                        </h4>
                        <span class="badge bg-primary" th:text="'Tổng: ' + ${products.totalElements} + ' sản phẩm'">Tổng: 0 sản phẩm</span>
                    </div>
                    <div class="card-body">
                        <div class="row" th:if="${!products.empty}">
                            <div th:each="product : ${products.content}" class="col-md-4 mb-4">
                                <div class="card h-100">
                                    <img th:src="${product.images}" 
                                         th:alt="${product.productName}"
                                         class="card-img-top" 
                                         style="height: 200px; object-fit: cover;"
                                         onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title" th:text="${product.productName}">Tên sản phẩm</h5>
                                        <p class="card-text">
                                            <small class="text-muted">
                                                Mã: <span th:text="${product.productCode}">123456</span> | 
                                                Danh mục: <span th:text="${product.category.categoryName}">Danh mục</span>
                                            </small>
                                        </p>
                                        <p class="card-text">
                                            <strong class="text-primary" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</strong>
                                        </p>
                                        <p class="card-text">
                                            <small>
                                                Còn lại: <span th:text="${product.stock}">0</span> | 
                                                Đã bán: <span th:text="${product.amount}">0</span>
                                            </small>
                                        </p>
                                        <div class="mt-auto">
                                            <a th:href="@{'/products/' + ${product.productId}}" class="btn btn-primary btn-sm w-100">
                                                <i class="fas fa-eye"></i> Xem chi tiết
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div th:if="${products.empty}" class="alert alert-info text-center">
                            <h4>Không có sản phẩm nào</h4>
                            <p>Hiện tại chưa có sản phẩm nào trong danh mục này.</p>
                        </div>
                        
                        <!-- Pagination -->
                        <nav th:if="${totalPages > 1}" aria-label="Page navigation">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                    <a class="page-link" 
                                       th:href="@{/products(page=${currentPage - 1}, category=${currentCategory})}">Trước</a>
                                </li>
                                
                                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                                    class="page-item" 
                                    th:classappend="${i == currentPage} ? 'active' : ''">
                                    <a class="page-link" 
                                       th:href="@{/products(page=${i}, category=${currentCategory})}"
                                       th:text="${i + 1}">1</a>
                                </li>
                                
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                                    <a class="page-link" 
                                       th:href="@{/products(page=${currentPage + 1}, category=${currentCategory})}">Sau</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

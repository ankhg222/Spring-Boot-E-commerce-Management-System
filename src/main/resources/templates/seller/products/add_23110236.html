<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout_23110236}">
<head>
    <title>Thêm sản phẩm mới</title>
    <link th:href="@{/css/upload.css}" rel="stylesheet">
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Thêm sản phẩm mới</h2>
                    <a th:href="@{/seller/products}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/seller/products/add}" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="productName" class="form-label">Tên sản phẩm</label>
                                        <input type="text" class="form-control" id="productName" name="productName" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="productCode" class="form-label">Mã sản phẩm</label>
                                        <input type="text" class="form-control" id="productCode" name="productCode" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="category" class="form-label">Danh mục</label>
                                        <select class="form-select" id="category" name="category.categoryId" required>
                                            <option value="">Chọn danh mục</option>
                                            <option th:each="cat : ${categories}" 
                                                    th:value="${cat.categoryId}" 
                                                    th:text="${cat.categoryName}">
                                            </option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="price" class="form-label">Giá</label>
                                        <input type="number" class="form-control" id="price" name="price" 
                                               min="0" step="0.01" required>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="amount" class="form-label">Số lượng</label>
                                        <input type="number" class="form-control" id="amount" name="amount" 
                                               min="0" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="stock" class="form-label">Tồn kho</label>
                                        <input type="number" class="form-control" id="stock" name="stock" 
                                               min="0" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="wishlist" class="form-label">Yêu thích</label>
                                        <input type="number" class="form-control" id="wishlist" name="wishlist" 
                                               min="0" value="0">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="images" class="form-label">Hình ảnh</label>
                                        <div class="upload-container">
                                            <div class="upload-area" id="uploadArea">
                                                <div class="upload-icon">
                                                    <i class="fas fa-cloud-upload-alt"></i>
                                                </div>
                                                <div class="upload-text">Kéo thả ảnh vào đây hoặc click để chọn</div>
                                                <div class="upload-subtext">Hỗ trợ: JPG, PNG, GIF (Tối đa 10MB)</div>
                                                <input type="file" class="upload-input" id="imageInput" accept="image/*">
                                            </div>
                                            
                                            <!-- Upload Progress -->
                                            <div class="upload-progress" id="uploadProgress">
                                                <div class="progress-bar">
                                                    <div class="progress-fill" id="progressFill"></div>
                                                </div>
                                                <div class="upload-status" id="uploadStatus">Đang upload...</div>
                                            </div>
                                            
                                            <!-- Image Preview -->
                                            <div class="image-preview-container" id="imagePreview" style="display: none;">
                                                <img class="image-preview" id="previewImage" src="" alt="Preview">
                                                <div class="image-actions">
                                                    <button type="button" class="btn btn-upload" onclick="uploadImage()">
                                                        <i class="fas fa-upload"></i> Upload
                                                    </button>
                                                    <button type="button" class="btn btn-remove" onclick="removeImage()">
                                                        <i class="fas fa-trash"></i> Xóa
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Hidden input để lưu URL ảnh đã upload -->
                                        <input type="hidden" id="uploadedImageUrl" name="images">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Mô tả</label>
                                <textarea class="form-control" id="description" name="description" rows="4" 
                                          placeholder="Nhập mô tả sản phẩm..."></textarea>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-plus"></i> Thêm sản phẩm
                                </button>
                                <a th:href="@{/seller/products}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Hủy
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script>
let selectedFile = null;
let uploadedImageUrl = '';

const uploadArea = document.getElementById('uploadArea');
const imageInput = document.getElementById('imageInput');
const imagePreview = document.getElementById('imagePreview');
const uploadProgress = document.getElementById('uploadProgress');
const progressFill = document.getElementById('progressFill');
const uploadStatus = document.getElementById('uploadStatus');
const uploadedImageUrlInput = document.getElementById('uploadedImageUrl');

// Drag and drop events
uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files);
    if (files.length > 0) {
        handleFile(files[0]);
    }
});

// Click to select file
uploadArea.addEventListener('click', () => {
    imageInput.click();
});

// File input change
imageInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
    }
});

function handleFile(file) {
    // Check if it's an image
    if (!file.type.startsWith('image/')) {
        showStatus('Vui lòng chọn file hình ảnh!', 'error');
        return;
    }
    
    // Check file size (10MB)
    if (file.size > 10 * 1024 * 1024) {
        showStatus('Kích thước file không được vượt quá 10MB!', 'error');
        return;
    }
    
    selectedFile = file;
    
    // Show preview
    const reader = new FileReader();
    reader.onload = (e) => {
        document.getElementById('previewImage').src = e.target.result;
        imagePreview.style.display = 'block';
    };
    reader.readAsDataURL(file);
}

function uploadImage() {
    if (!selectedFile) {
        showStatus('Vui lòng chọn ảnh trước khi upload!', 'error');
        return;
    }
    
    uploadProgress.style.display = 'block';
    showStatus('Đang upload...', 'uploading');
    
    const formData = new FormData();
    formData.append('file', selectedFile);
    
    // Simulate progress
    let progress = 0;
    const progressInterval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress > 90) progress = 90;
        progressFill.style.width = progress + '%';
    }, 200);
    
    fetch('/api/upload', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        clearInterval(progressInterval);
        progressFill.style.width = '100%';
        
        if (data.success) {
            showStatus('Upload thành công!', 'success');
            uploadedImageUrl = data.url;
            uploadedImageUrlInput.value = uploadedImageUrl;
            
            setTimeout(() => {
                uploadProgress.style.display = 'none';
            }, 2000);
        } else {
            showStatus('Lỗi upload: ' + data.error, 'error');
        }
    })
    .catch(error => {
        clearInterval(progressInterval);
        console.error('Error:', error);
        showStatus('Lỗi khi upload file!', 'error');
    });
}

function removeImage() {
    selectedFile = null;
    uploadedImageUrl = '';
    imagePreview.style.display = 'none';
    uploadProgress.style.display = 'none';
    uploadedImageUrlInput.value = '';
    imageInput.value = '';
}

function showStatus(message, type) {
    uploadStatus.textContent = message;
    uploadStatus.className = `upload-status status-${type}`;
}

// Auto upload when file is selected
imageInput.addEventListener('change', () => {
    if (imageInput.files.length > 0) {
        setTimeout(uploadImage, 500);
    }
});
</script>
